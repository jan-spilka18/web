<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honza Spilka – náhled webu</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;family=Outfit:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
h1,h2,h3,[style*="font-weight: 6"],[style*="font-weight: 7"],[style*="font-weight: 9"]{font-family:Inter,system-ui,sans-serif}
html{scroll-behavior:smooth}
a{color:#F2DE6B}a:hover{color:#FFF0A6}
input:focus,textarea:focus,a:focus-visible,button:focus-visible{outline:2px solid #5FC3CE;outline-offset:2px}
button{transition:background .2s,color .2s,border-color .2s,transform .2s}
button:hover{transform:translateY(-1px)}
@keyframes fabPulse{0%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 0 rgba(242,222,107,.55)}70%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 18px rgba(242,222,107,0)}100%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 0 rgba(242,222,107,0)}}
@keyframes fabRing{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
[data-fab]{animation:fabPulse 2.6s ease-out infinite}[data-fab]:hover{transform:scale(1.08)}[data-fab]:hover svg{animation:fabRing .6s ease}
[data-cta]{transition:transform .3s ease, box-shadow .3s ease}[data-cta]:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(0,0,0,.28)}[data-cta] svg{transition:transform .3s ease}[data-cta]:hover svg{transform:translateX(6px)}
[data-pop]{animation:popIn .25s ease-out;transform-origin:100% 100%}
@media (prefers-reduced-motion: reduce){[data-fab],[data-fab]:hover svg,[data-pop]{animation:none}}
nav a{transition:opacity .2s}nav a:hover{opacity:.7}
[data-hover]{transition:transform .3s ease, box-shadow .3s ease}[data-hover]:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(242,222,107,.22)}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: #171717; color: #FFFFFF; font-family: Outfit, Inter, system-ui, sans-serif; font-weight: 300; font-size: 18px; line-height: 1.6">

<!-- NAVIGACE -->
<header style="position: sticky; top: 0; z-index: 10; padding: 16px 24px 0; pointer-events: none">
<div style="pointer-events: auto; max-width: {{navW}}; margin: 0 auto; padding: 10px 12px 10px 22px; box-sizing: border-box; border-radius: 28px; background: rgba(23,23,23,0.84); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid #3A3A3A; box-shadow: {{navShadow}}; display: flex; justify-content: space-between; align-items: center; gap: 8px 28px; flex-wrap: wrap; transition: max-width .6s cubic-bezier(.2,.8,.2,1), box-shadow .6s ease">
<div role="img" aria-label="Honza Spilka" style="display: flex; align-items: center; gap: 12px"><div style="font-size: 24px; letter-spacing: -0.04em; line-height: 1; white-space: nowrap"><span style="font-weight: 300">honza</span><span style="font-weight: 900">spilka</span><span style="font-weight: 900; color: #F2DE6B">.</span></div></div>
<nav aria-label="Hlavní" style="display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; font-size: 16px">
<a href="#pribeh" style="color: #FFFFFF; text-decoration: none; padding: 10px 0">Příběh</a>
<a href="#spoluprace" style="color: #FFFFFF; text-decoration: none; padding: 10px 0">Spolupráce</a>
<a href="#garance" style="color: #FFFFFF; text-decoration: none; padding: 10px 0">Garance</a>
<a href="#reference" style="color: #FFFFFF; text-decoration: none; padding: 10px 0">Reference</a>
<a href="#cviceni" style="color: #FFFFFF; text-decoration: none; padding: 10px 0">Cvičení</a>
<a href="#kontakt" style="background: #F2DE6B; color: #171717; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 999px">Úvodní hovor zdarma</a>
</nav>
</div>
</header>

<!-- PLOVOUCÍ TLAČÍTKO -->
<div style="position: fixed; right: 20px; bottom: 20px; z-index: 9; display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
<sc-if value="{{fabOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Úvodní hovor" data-pop style="width: 260px; max-width: calc(100vw - 40px); background: #FFFFFF; color: #171717; border-radius: 18px 18px 4px 18px; padding: 18px; box-sizing: border-box; box-shadow: 0 14px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 17px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">{{fabMsg}}</div>
<div style="display: flex; gap: 8px; align-items: center">
<a href="#kontakt" onClick="{{fabClose}}" style="flex: 1 1 auto; text-align: center; background: #F2DE6B; color: #171717; font-weight: 700; text-decoration: none; padding: 12px 14px; border-radius: 999px; font-size: 15px">Jdu do toho</a>
<button type="button" onClick="{{fabNext}}" aria-label="Jiná hláška" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; background: #F3F3F3; color: #171717; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 V8 H12"></path><path d="M16 8 C14.8 5.6 12.6 4 10 4 C6.7 4 4 6.7 4 10 C4 13.3 6.7 16 10 16 C12.4 16 14.5 14.6 15.5 12.5"></path></svg></button>
</div>
</div>
</sc-if>
<button type="button" data-fab onClick="{{fabToggle}}" aria-expanded="{{fabOpen}}" aria-label="Úvodní hovor zdarma" style="width: 60px; height: 60px; border-radius: 50%; background: #F2DE6B; color: #171717; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 28px rgba(0,0,0,0.4); font-family: inherit"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 H8 L9.5 7.5 L7.5 9 C8.5 11 9.9 12.4 12 13.5 L13.5 11.5 L18 13 V17 C18 17.6 17.6 18 17 18 C9 18 3 11 3 4 C3 3.4 3.4 3 4 3 Z"></path></svg></button>
</div>

<!-- HERO -->
<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 48px; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: center">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 28px; align-items: flex-start">

<h1 style="margin: 0; font-size: clamp(40px, 5.2vw, 68px); line-height: 1.02; font-weight: 700; letter-spacing: -0.035em">Měj při sobě někoho, vedle koho <span style="color: #F2DE6B">porosteš.</span></h1>
<p style="margin: 0; font-size: clamp(18px, 2vw, 21px); color: #C9C9C9; max-width: 600px">Pět let jsem budoval firmu, která dosáhla ročního obratu 120 milionů korun. Teď pomáhám růst lidem ve všech oblastech jejich života a ukazuji jim, co všechno je možné změnit za tři měsíce.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<a href="#kontakt" style="display: inline-block; background: #F2DE6B; color: #171717; font-weight: 700; text-decoration: none; padding: 18px 30px; border-radius: 10px; font-size: 18px">Domluvit úvodní hovor</a>
<a href="#reference" style="display: inline-block; color: #FFFFFF; font-weight: 600; text-decoration: none; padding: 17px 26px; border-radius: 10px; font-size: 18px; border: 1px solid #7A7A7A">Příběhy klientů</a>
</div>
<a href="#garance" style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; padding: 8px 0"><svg aria-hidden="true" width="20" height="23" viewBox="0 0 56 64" fill="none" stroke="#F2DE6B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M28 3 L52 12 V30 C52 46 42 56 28 61 C14 56 4 46 4 30 V12 Z"></path><path d="M17 32 L25 40 L40 24"></path></svg><span>S garancí vrácení peněz</span></a>
<div style="display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; color: #C9C9C9"><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#F2DE6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto"><path d="M4 10.5 L8.5 15 L16 6"></path></svg>Úvodní hodina zdarma</span><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#F2DE6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto"><path d="M4 10.5 L8.5 15 L16 6"></path></svg>Jsem ti na příjmu celou dobu</span><span style="display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#F2DE6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto"><path d="M4 10.5 L8.5 15 L16 6"></path></svg>Jen pár klientů najednou</span></div>

</div>

<section style="background: #FFFFFF; color: #171717; padding: 104px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 data-reveal style="margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700">Poznáváš se?</h2>
<p style="margin: 0; color: #666666; font-size: 17px">Klikni na to, co je ti nejblíž.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{problems}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="text-align: left; font-family: inherit; cursor: pointer; border-radius: 14px; padding: 24px 26px; display: flex; gap: 18px; align-items: baseline; min-height: 64px; background: {{p.bg}}; color: {{p.fg}}; border: 1px solid {{p.bd}}">
<span style="font-size: 14px; font-weight: 700; color: {{p.numFg}}">{{p.num}}</span>
<span style="font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">{{p.title}}</span>
</button>
</sc-for>
</div>
<div aria-live="polite" style="flex: 999 1 460px; min-width: 0; background: #F3F3F3; border-radius: 18px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1F7A85">Jak to vypadá</div>
<p style="margin: 0; font-size: 21px; line-height: 1.45">{{active.look}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1F7A85">Co s tím uděláme</div>
<p style="margin: 0; font-size: 18px; color: #444444">{{active.fix}}</p>
</div>
<figure style="margin: 8px 0 0; padding: 20px 0 0; border-top: 1px solid #DDDDDD; display: flex; flex-direction: column; gap: 8px">
<div style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; background: #5FC3CE; color: #171717; padding: 3px 8px; border-radius: 4px">ILUSTRAČNÍ REFERENCE</div>
<blockquote style="margin: 0; font-size: 17px; font-style: italic">{{active.ref}}</blockquote>
<figcaption style="font-size: 14px; color: #666666">Ilustrační klient, podnikatel</figcaption>
</figure>
</div>
</div>
<a href="#kontakt" data-cta style="display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between; text-decoration: none; background: #171717; color: #FFFFFF; border-radius: 24px; padding: 32px clamp(24px, 4vw, 44px); box-sizing: border-box">
<span style="flex: 1 1 380px; min-width: 0; font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">Poznal ses? Za rok to bude stejný. Nebo to může být jinak už za tři měsíce.</span>
<span style="display: inline-flex; align-items: center; gap: 12px; background: #F2DE6B; color: #171717; font-weight: 700; padding: 16px 26px; border-radius: 999px; font-size: 17px; white-space: nowrap">Chci to změnit<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 H16 M11 5 L16 10 L11 15"></path></svg></span>
</a>
</div>
</section>

<!-- PŘÍBĚH, INTERAKTIVNÍ OSA -->
<section id="pribeh" style="background: #1E1E1E; color: #FFFFFF; padding: 104px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5FC3CE">Můj příběh</div>
<h2 data-reveal style="margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700">Znám tvůj svět. Prošel jsem si ho.</h2>
</div>
<p style="flex: 1 1 380px; min-width: 0; margin: 0; color: #C9C9C9">Nejsem kouč z učebnice. Udělal jsem hromadu chyb, a proto vím, jaký to je.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{story}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="flex: 1 1 150px; font-family: inherit; cursor: pointer; text-align: left; border-radius: 12px; padding: 14px 18px; min-height: 64px; display: flex; flex-direction: column; gap: 2px; background: {{s.bg}}; color: {{s.fg}}; border: 1px solid {{s.bd}}">
<span style="font-size: 13px; font-weight: 700">{{s.when}}</span>
<span style="font-size: 16px; font-weight: 600; line-height: 1.25">{{s.short}}</span>
</button>
</sc-for>
</div>

<div aria-live="polite" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 380px; min-width: 0; aspect-ratio: 3 / 2; border-radius: 16px; background: #171717; border: 1px dashed #7A7A7A; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; color: #B5B5B5; font-size: 15px">{{activeStory.photo}}</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 16px; font-weight: 700; color: #F2DE6B">{{activeStory.when}}</div>
<h3 style="margin: 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">{{activeStory.title}}</h3>
<p style="margin: 0; color: #C9C9C9; font-size: 19px">{{activeStory.text}}</p>
<div style="display: flex; gap: 12px; margin-top: 8px">
<button type="button" onClick="{{storyPrev}}" aria-label="Předchozí kapitola" style="width: 52px; height: 52px; border-radius: 50%; background: transparent; color: #FFFFFF; border: 1px solid #7A7A7A; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L6 10 L12 16"></path></svg></button>
<button type="button" onClick="{{storyNext}}" aria-label="Další kapitola" style="width: 52px; height: 52px; border-radius: 50%; background: #F2DE6B; color: #171717; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 L14 10 L8 16"></path></svg></button>
</div>
</div>
</div>

<div style="background: #171717; border-radius: 24px; padding: 32px clamp(24px, 4vw, 44px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between">
<div aria-live="polite" style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5FC3CE">Čím se řídím · {{ruleCount}}</div>
<blockquote style="margin: 0; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: #F2DE6B">{{rule}}</blockquote>
</div>
<div style="display: flex; gap: 12px">
<button type="button" onClick="{{rulePrev}}" aria-label="Předchozí pravidlo" style="width: 52px; height: 52px; border-radius: 50%; background: transparent; color: #FFFFFF; border: 1px solid #7A7A7A; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 L6 10 L12 16"></path></svg></button>
<button type="button" onClick="{{ruleNext}}" aria-label="Další pravidlo" style="width: 52px; height: 52px; border-radius: 50%; background: #F2DE6B; color: #171717; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 L14 10 L8 16"></path></svg></button>
</div>
</div>
</div>
</section>

<!-- MOJE PROČ -->
<div style="background: #FFFFFF; color: #171717; padding-bottom: 104px">
<section style="max-width: 1200px; margin: 0 auto; padding: 104px 24px 0; display: flex; flex-wrap: wrap; gap: 48px 64px">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1F7A85">Proč to dělám</div>
<h2 data-reveal style="margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700">Je to tak trochu <span style="box-shadow: inset 0 -0.3em 0 #F2DE6B">sobecký.</span></h2>
</div>
<div style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px; font-size: 20px">
<p style="margin: 0">Nabíjí mě vidět lidi, jak kolem mě rostou.</p>
<p style="margin: 0; color: #444444">Když rostou oni, rostu i já. Proto na sobě makám, ať jdu klientům příkladem.</p>
<p style="margin: 0; color: #444444">A proto dávám lidem systém, jak na sobě pracovat.</p>
</div>
</section>

<!-- VIDEO PŘEDSTAVENÍ -->
<section style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 0">
<div style="position: relative; aspect-ratio: 21 / 9; min-height: 280px; border-radius: 20px; background: #171717; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; box-sizing: border-box">
<svg aria-hidden="true" width="84" height="84" viewBox="0 0 84 84" fill="none"><circle cx="42" cy="42" r="41" fill="#F2DE6B"></circle><path d="M35 28 L58 42 L35 56 Z" fill="#171717"></path></svg>
<div style="font-size: 22px; font-weight: 700">Minuta, ve který mě poznáš</div>
<div style="color: #B5B5B5; font-size: 15px">[VIDEO: tvoje krátké představení na šířku, z vlastních záběrů]</div>
</div>
</section>
</div>

<!-- JAK TO FUNGUJE -->
<section id="spoluprace" style="background: #171717; color: #FFFFFF; padding: 104px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5FC3CE">Tři měsíce spolu</div>
<h2 data-reveal style="margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700">Systém, se kterým rosteš <span style="color: #F2DE6B">každý den</span></h2>
<p style="margin: 0; color: #C9C9C9">Žádný sezení jednou za tři týdny a mezi tím ticho. Jsem ti celou dobu na příjmu.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 240px; min-width: 0; border-top: 2px solid #F2DE6B; padding-top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; color: #B5B5B5">Krok 1</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Úvodní hovor</h3>
<p style="margin: 0; color: #C9C9C9; font-size: 16px">Hodina zdarma. Zjistíme, kde jsi a co chceš změnit.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; border-top: 2px solid #F2DE6B; padding-top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; color: #B5B5B5">Krok 2</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Cíl</h3>
<p style="margin: 0; color: #C9C9C9; font-size: 16px">Pojmenujeme změnu, na kterou se těšíš.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; border-top: 2px solid #F2DE6B; padding-top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; color: #B5B5B5">Krok 3</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Kroky na každý den</h3>
<p style="margin: 0; color: #C9C9C9; font-size: 16px">Konkrétní kroky, který tě k cíli posouvají každej den.</p>
</div>
<div style="flex: 1 1 240px; min-width: 0; border-top: 2px solid #5FC3CE; padding-top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700; color: #B5B5B5">Po celou dobu</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">Jsem na příjmu</h3>
<p style="margin: 0; color: #C9C9C9; font-size: 16px">Máš se o koho opřít. Nejvíc práce se děje mezi sezeními.</p>
</div>
</div>
<div style="background: #1E1E1E; border-radius: 20px; padding: clamp(28px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5FC3CE">V ceně spolupráce</div>
<h3 style="margin: 0; font-size: clamp(26px, 3vw, 36px); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Dostaneš ode mě aplikaci, která ti pomůže <span style="color: #F2DE6B">vydržet</span></h3>
<p style="margin: 0; color: #C9C9C9">Ráno víš, co tě čeká. Večer vidíš, že ses posunul.</p>
</div>
<div style="flex: 1 1 100%; min-width: 0; display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start">

<p style="margin: 0; color: #444444; font-size: 16px">Ne cíl firmy ani to, co se od tebe čeká. Víš, kam jdeš a proč.</p>

<section id="cviceni" style="background: #F3F3F3; color: #171717; padding: 104px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: flex-start">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1F7A85">Cvičení na pět minut</div>
<h2 data-reveal style="margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700">Odejdi odsud <span style="box-shadow: inset 0 -0.3em 0 #F2DE6B">o krok dál</span></h2>
<p style="margin: 0; color: #444444">Čtyři otázky. Odpověz poctivě a něco se o sobě dozvíš.</p>
<p style="margin: 0; color: #666666; font-size: 15px">Na konci ti odpovědi pošlu na e-mail.</p>
</div>
<div aria-live="polite" style="flex: 999 1 480px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.06)">
<sc-if value="{{exAsk}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 16px">
<div style="font-size: 14px; font-weight: 700; color: #1F7A85; white-space: nowrap">{{exLabel}}</div>
<div aria-hidden="true" style="flex: 1 1 auto; height: 4px; border-radius: 2px; background: #DDDDDD"><div style="height: 4px; border-radius: 2px; background: #F2DE6B; width: {{exPct}}"></div></div>
</div>
<label for="ex-odpoved" style="font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">{{exQ}}</label>
<textarea id="ex-odpoved" rows="5" value="{{exVal}}" onChange="{{exChange}}" placeholder="Piš, jak ti huba narostla." style="background: #FFFFFF; color: #171717; border: 1px solid #8A8A8A; border-radius: 10px; padding: 14px 16px; font-size: 17px; font-family: inherit; box-sizing: border-box; resize: vertical"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between">
<button type="button" onClick="{{exBack}}" style="background: transparent; color: #171717; border: 1px solid #8A8A8A; padding: 14px 22px; border-radius: 10px; font-size: 16px; font-family: inherit; cursor: pointer; min-height: 52px">Zpět</button>
<button type="button" onClick="{{exNext}}" style="background: #F2DE6B; color: #171717; font-weight: 700; border: 0; padding: 14px 28px; border-radius: 10px; font-size: 17px; font-family: Inter, system-ui, sans-serif; cursor: pointer; min-height: 52px">{{exNextLabel}}</button>
</div>
</div>
</sc-if>
<sc-if value="{{exEmail}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{exSend}}" style="display: flex; flex-direction: column; gap: 20px">
<div style="font-size: 14px; font-weight: 700; color: #1F7A85">Poslední krok</div>
<h3 style="margin: 0; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">Kam ti mám tvoje odpovědi poslat?</h3>
